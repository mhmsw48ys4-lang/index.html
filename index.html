<body>

<div class="header">
<h1>مراقب استراتيجية الارتكاز</h1>
<p>تحليل السهم والارتكاز والتقسيم والقمة بعد التقسيم</p>
</div>

<div class="container">


<!-- =========================
     البحث الفردي
========================= -->

<div class="search">

<input
id="symbolInput"
type="text"
placeholder="اكتب رمز السهم مثل NTCL">

<button onclick="addStock()">
إضافة
</button>

</div>

<div id="status" class="status"></div>


<!-- =========================
     فرز التقسيمات
========================= -->

<div class="scanner">

<div class="scannerTitle">
📊 مسح أسهم الارتكاز
</div>

<div class="scannerDesc">
المسح التلقائي يبحث عن الأسهم بين $1 و $7 التي هبطت ثم ثبتت عند قاعها 3–4 أيام. بعدها تفرزها يدوياً بشروطك الأصلية.
</div>

<button
class="scanButton"
onclick="autoScanSplits()">
🔎 مسح أسهم الارتكاز تلقائياً
</button>

<div style="height:8px"></div>

<div class="scannerDesc">
أو افحص رموزاً محددة يدوياً:
</div>

<textarea
id="scanInput"
class="scanInput"
placeholder="مثال:
NTCL
PN
FEMY
AMIX

أو اكتبها مفصولة بفواصل"
></textarea>

<button
class="scanButton"
onclick="scanSplits()">
بدء الفرز اليدوي
</button>

<div id="scanStatus" class="scanStatus"></div>

<div id="scanResults" class="scanResults"></div>

</div>


<!-- =========================
     الأسهم
========================= -->

<div id="stocks">

<div class="empty">
اكتب رمز السهم ثم اضغط إضافة
</div>

</div>

</div>


<script>

const stocks={};


/* =========================
   أدوات
========================= */

function money(v){

if(v===null||v===undefined||!isFinite(v))
return "-";

return "$"+Number(v).toFixed(2);

}


function num(v,d=2){

if(v===null||v===undefined||!isFinite(v))
return "-";

return Number(v).toFixed(d);

}


function dateText(d){

if(!d)
return "-";

const p=d.split("-");

return p.length===3
?p[2]+"/"+p[1]+"/"+p[0]
:d;

}


/* =========================
   جلب البيانات
========================= */

async function getStock(symbol){

const response=await fetch(
"/.netlify/functions/stock?symbol="+
encodeURIComponent(symbol),
{cache:"no-store"}
);

let result;

try{

result=await response.json();

}catch(e){

throw new Error("الاستجابة من السيرفر غير صحيحة");

}

if(!response.ok){

let message=
result?.error||
"تعذر جلب بيانات السهم";

if(result?.details)
message+=" — "+result.details;

throw new Error(message);

}

return result;

}


/* =========================
   تحويل الأسعار
========================= */

function makeRows(data){

const series=data["Time Series (Daily)"];

if(!series)
throw new Error(
"بيانات الأسعار اليومية غير موجودة"
);

return Object.entries(series)

.map(([date,v])=>({

date,

open:Number(v["1. open"]),

high:Number(v["2. high"]),

low:Number(v["3. low"]),

close:Number(v["4. close"]),

volume:Number(v["5. volume"])

}))

.filter(x=>isFinite(x.close))

.sort(
(a,b)=>a.date.localeCompare(b.date)
);

}


/* =========================
   EMA
========================= */

function ema(values,period){

if(values.length<period)
return null;

const k=2/(period+1);

let result=0;

for(let i=0;i<period;i++)
result+=values[i];

result/=period;

for(
let i=period;
i<values.length;
i++
){

result=
values[i]*k+
result*(1-k);

}

return result;

}


/* =========================
   RSI
========================= */

function rsi(values,period=14){

if(values.length<=period)
return null;

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

const d=
values[i]-values[i-1];

if(d>=0)
gains+=d;
else
losses+=Math.abs(d);

}

let avgGain=gains/period;
let avgLoss=losses/period;

for(
let i=period+1;
i<values.length;
i++
){

const d=
values[i]-values[i-1];

const gain=d>0?d:0;

const loss=
d<0?Math.abs(d):0;

avgGain=
((avgGain*(period-1))+gain)/period;

avgLoss=
((avgLoss*(period-1))+loss)/period;

}

if(avgLoss===0)
return 100;

const rs=
avgGain/avgLoss;

return 100-(100/(1+rs));

}


/* =========================
   MACD
========================= */

function macd(values){

if(values.length<35){

return{
macd:null,
signal:null,
histogram:null
};

}

const arr=[];

for(
let i=0;
i<values.length;
i++
){

const part=
values.slice(0,i+1);

const e12=
ema(part,12);

const e26=
ema(part,26);

if(
e12!==null&&
e26!==null
){

arr.push(e12-e26);

}

}

const signal=
ema(arr,9);

const current=
arr[arr.length-1];

return{

macd:current,

signal,

histogram:
signal!==null
?current-signal
:null

};

}


/* =========================
   RVOL
========================= */

function rvol(rows){

if(rows.length<21)
return null;

const latest=
rows[rows.length-1];

const old=
rows.slice(
Math.max(0,rows.length-21),
rows.length-1
);

const avg=
old.reduce(
(s,x)=>s+x.volume,
0
)/old.length;

return avg
?latest.volume/avg
:null;

}


/* =========================
   القاع والارتكاز
========================= */

function findPivot(rows){

if(rows.length<5)
return null;

let pivot=null;

const start=
Math.max(1,rows.length-60);

for(
let i=start;
i<rows.length-1;
i++
){

const prev=rows[i-1];
const cur=rows[i];
const next=rows[i+1];

if(
cur.low<=prev.low&&
cur.low<=next.low
){

pivot={

price:cur.low,

date:cur.date,

index:i

};

}

}

return pivot;

}


/* =========================
   الثبات 4 أيام
========================= */

function stability(rows,pivot){

if(!pivot){

return{

count:0,

complete:false,

pivot:null

};

}

let p=pivot.price;

let index=pivot.index;

let count=0;

for(
let i=pivot.index+1;
i<rows.length;
i++
){

const candle=rows[i];

if(candle.low<p){

p=candle.low;

index=i;

count=0;

}else{

count++;

}

}

return{

count:Math.min(count,4),

complete:count>=4,

pivot:{

price:p,

date:rows[index].date

}

};

}


/* =========================
   التحليل الأساسي
========================= */

function analyze(result){

let rows=
makeRows(result.data);


/*
إذا وجد تقسيم:
نستخدم البيانات من تاريخ آخر تقسيم
وما بعده للقاع والقمة.
*/

let split=
result.split||null;

let postSplitRows=
rows;

if(split?.date){

postSplitRows=
rows.filter(
x=>x.date>=split.date
);

if(postSplitRows.length<5){

postSplitRows=rows;

}

}


const latest=
rows[rows.length-1];

const previous=
rows[rows.length-2];

const closes=
rows.map(x=>x.close);


const e20=
ema(closes,20);

const e30=
ema(closes,30);

const e50=
ema(closes,50);


const rsi14=
rsi(closes,14);


const macdData=
macd(closes);


const relativeVolume=
rvol(rows);


/* الارتكاز */

const pivot=
findPivot(postSplitRows);

let fixedPivot=null;

if(pivot){

const realIndex=
rows.findIndex(
x=>x.date===pivot.date
);

fixedPivot={

price:pivot.price,

date:pivot.date,

index:realIndex

};

}

const stable=
stability(rows,fixedPivot);


/* أعلى وأقل سعر بعد التقسيم */

let highestAfter=null;

let lowestAfter=null;

if(postSplitRows.length){

highestAfter=
postSplitRows.reduce(
(a,b)=>b.high>a.high?b:a,
postSplitRows[0]
);

lowestAfter=
postSplitRows.reduce(
(a,b)=>b.low<a.low?b:a,
postSplitRows[0]
);

}


/* الأيام بعد التقسيم */

let daysAfter=null;

if(split?.date){

const d1=
new Date(
split.date+"T00:00:00"
);

const d2=
new Date(
latest.date+"T00:00:00"
);

daysAfter=
Math.max(
0,
Math.floor(
(d2-d1)/
(1000*60*60*24)
)
);

}


return{

symbol:result.symbol,

rows,

latest,

previous,

ema20:e20,

ema30:e30,

ema50:e50,

rsi:rsi14,

macd:macdData,

rvol:relativeVolume,

pivot:stable.pivot,

stability:stable,

split,

daysAfter,

highestAfter,

lowestAfter

};

}


/* =========================
   شروط الاستراتيجية
========================= */

function condition(name,ok,text){

return`

<div class="condition">

<span>${name}</span>

<span class="badge ${ok?"green":"yellow"}">

${ok?"✓":"•"} ${text}

</span>

</div>

`;

}


/* =========================
   رسم البطاقة
========================= */

function renderStock(a){

const l=a.latest;

const change=
l.close-a.previous.close;

const changePct=
a.previous.close
?
(change/a.previous.close)*100
:0;

const cls=
change>0
?"green"
:change<0
?"red"
:"";


/*
الاستراتيجية الأصلية:
RSI منخفض
ثم الارتكاز
ثم التحسن
*/

const rsiGood=
a.rsi!==null&&
a.rsi>=23&&
a.rsi<=35;


const macdGood=
a.macd.histogram!==null&&
a.macd.histogram>0;


const ema20Good=
a.ema20!==null&&
l.close>a.ema20;


const ema30Good=
a.ema30!==null&&
l.close>a.ema30;


const ema50Good=
a.ema50!==null&&
l.close>a.ema50;


const volumeGood=
a.rvol!==null&&
a.rvol>=1.2;


const stableGood=
a.stability.complete;


/* التقسيم */

let splitHTML="";


if(a.split){

splitHTML=`

<div class="box">

<div class="boxTitle">
📊 التقسيم
</div>

<div class="row">
<span>آخر تقسيم</span>
<strong>
${dateText(a.split.date)}
</strong>
</div>

<div class="row">
<span>نوع التقسيم</span>
<strong>
${a.split.ratio||"-"}
</strong>
</div>

<div class="row">
<span>مر بعد التقسيم</span>
<strong class="blue">
${a.daysAfter!==null
?a.daysAfter+" يوم"
:"-"}
</strong>
</div>

<div class="row">
<span>أعلى قمة بعد التقسيم</span>
<strong class="green">
${a.highestAfter
?money(a.highestAfter.high)
:"-"}
</strong>
</div>

<div class="row">
<span>تاريخ أعلى قمة</span>
<strong>
${a.highestAfter
?dateText(a.highestAfter.date)
:"-"}
</strong>
</div>

<div class="row">
<span>أقل قاع بعد التقسيم</span>
<strong>
${a.lowestAfter
?money(a.lowestAfter.low)
:"-"}
</strong>
</div>

</div>

`;

}else{

splitHTML=`

<div class="box">

<div class="boxTitle">
📊 التقسيم
</div>

<div class="row">

<span>آخر تقسيم</span>

<strong class="yellow">
لا توجد بيانات تقسيم
</strong>

</div>

</div>

`;

}


return`

<div class="card">

<div class="cardHead">

<div>

<div class="symbol">
${a.symbol}
</div>

<div class="date">
آخر جلسة:
${dateText(l.date)}
</div>

</div>

<button
class="remove"
onclick="removeStock('${a.symbol}')">
حذف
</button>

</div>


<div class="priceBox">

<div>

<div class="label">
آخر إغلاق
</div>

<div class="bigPrice ${cls}">
${money(l.close)}
</div>

</div>


<div>

<div class="label">
التغير
</div>

<div class="bigPrice ${cls}">
${change>=0?"+":""}${num(change)}
</div>

<div class="${cls}">
${changePct>=0?"+":""}${num(changePct)}%
</div>

</div>

</div>


<div class="grid">


<div class="item">

<div class="label">
الافتتاح
</div>

<div class="value">
${money(l.open)}
</div>

</div>


<div class="item">

<div class="label">
أعلى سعر اليوم
</div>

<div class="value">
${money(l.high)}
</div>

</div>


<div class="item">

<div class="label">
أدنى سعر اليوم
</div>

<div class="value">
${money(l.low)}
</div>

</div>


<div class="item">

<div class="label">
حجم التداول
</div>

<div class="value">
${l.volume.toLocaleString()}
</div>

</div>


<div class="item">

<div class="label">
أقل قاع بعد التقسيم
</div>

<div class="value">
${a.lowestAfter
?money(a.lowestAfter.low)
:"-"}
</div>

</div>


<div class="item">

<div class="label">
تاريخ القاع
</div>

<div class="value">
${a.lowestAfter
?dateText(a.lowestAfter.date)
:"-"}
</div>

</div>


<div class="item">

<div class="label">
EMA 20
</div>

<div class="value">
${money(a.ema20)}
</div>

</div>


<div class="item">

<div class="label">
EMA 30
</div>

<div class="value">
${money(a.ema30)}
</div>

</div>


<div class="item">

<div class="label">
EMA 50
</div>

<div class="value">
${money(a.ema50)}
</div>

</div>


<div class="item">

<div class="label">
RSI 14
</div>

<div class="value">
${num(a.rsi,1)}
</div>

</div>


<div class="item">

<div class="label">
MACD
</div>

<div class="value ${macdGood?"green":""}">
${num(a.macd.macd,4)}
</div>

</div>


<div class="item">

<div class="label">
RVOL
</div>

<div class="value">
${a.rvol===null
?"-"
:num(a.rvol,2)+"x"}
</div>

</div>


</div>


${splitHTML}


<!-- الارتكاز -->

<div class="box">

<div class="boxTitle">
الارتكاز والثبات
</div>


<div class="row">

<span>
قاع الارتكاز
</span>

<strong>
${money(a.pivot?.price)}
</strong>

</div>


<div class="row">

<span>
تاريخ الارتكاز
</span>

<strong>
${dateText(a.pivot?.date)}
</strong>

</div>


<div class="row">

<span>
الثبات
</span>

<strong
class="${stableGood?"green":"yellow"}">

${a.stability.count}/4

${stableGood
?"مكتمل"
:"غير مكتمل"}

</strong>

</div>


<div class="row">

<span>
الارتداد من القاع
</span>

<strong class="green">

${
a.pivot
?
num(
(
(l.close-a.pivot.price)/
a.pivot.price
)*100

function parseSymbols(){

const text=
document.getElementById("scanInput")
.value
.trim()
.toUpperCase();

if(!text)

];

/* =========================
   المسح التلقائي للتقسيمات
========================= */

function isoDateDaysAgo(days){
  const d=new Date();
  d.setDate(d.getDate()-days);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

async function fetchSplitCalendar(){
  const from=isoDateDaysAgo(100);
  const to=new Date().toISOString().slice(0,10);

  const url=
    "/.netlify/functions/splits"+
    "?fromdate="+encodeURIComponent(from)+
    "&todate="+encodeURIComponent(to);

  const response=await fetch(url,{cache:"no-store"});

  if(!response.ok)
    throw new Error("تعذر جلب قائمة التقسيمات من خادم الموقع");

  const json=await response.json();
  const rows=json?.events||[];

  return rows.map(x=>{
    const symbol=String(
      x.symbol||x.ticker||x.Symbol||""
    ).trim().toUpperCase();

    const date=String(
      x.exDate||x.executionDate||x.date||""
    ).slice(0,10);

    const ratio=String(
      x.ratio||x.splitRatio||x.Ratio||"-"
    );

    return {symbol,date,ratio};
  }).filter(x=>x.symbol&&/^[-A-Z0-9.]+$/.test(x.symbol)&&x.date);
}

/* =========================
   المسح التلقائي:
   قائمة تقسيمات فقط
   ولا يلمس شروط البحث اليدوي
========================= */

async function autoScanSplits(){
  const status=document.getElementById("scanStatus");
  const results=document.getElementById("scanResults");
  results.innerHTML="";
  status.textContent="جاري مسح الأسهم $1–$7 والبحث عن هبوط ثبت عند القاع 3–4 أيام...";

  try{
    const response=await fetch("/.netlify/functions/pivot",{cache:"no-store"});
    if(!response.ok){
      const err=await response.json().catch(()=>({}));
      throw new Error(err.error||"تعذر جلب قائمة الأسهم المرشحة");
    }

    const json=await response.json();
    const symbols=Array.isArray(json?.symbols)?json.symbols:[];

    if(!symbols.length){
      status.textContent="انتهى المسح — لم تصل قائمة أسهم للفحص.";
      results.innerHTML='<div class="empty">لم تصل قائمة أسهم للفحص.</div>';
      return;
    }

    const found=[];
    const errors=[];
    const batchSize=10;

    for(let i=0;i<symbols.length;i+=batchSize){
      const batch=symbols.slice(i,i+batchSize);
      status.textContent="جاري فحص الثبات عند القاع "+Math.min(i+batch.length,symbols.length)+" من "+symbols.length+"...";

      const settled=await Promise.allSettled(batch.map(async symbol=>{
        const result=await getStock(symbol);
        return analyze(result);
      }));

      for(const r of settled){
        if(r.status!=="fulfilled") continue;

        const a=r.value;
        const price=Number(a?.latest?.close);
        const stableDays=Number(a?.stability?.count||0);

        // المسح التلقائي هنا مخصص لاكتشاف:
        // هبوط -> قاع محلي -> عدم كسر القاع لمدة 3 أو 4 أيام.
        // لا نفرض RSI/MACD/EMA/RVOL هنا؛ المستخدم يفرزها يدوياً بعد ذلك.
        if(
          a &&
          a.pivot &&
          a.stability &&
          stableDays>=3 &&
          stableDays<=4 &&
          Number.isFinite(price) &&
          price>=1 &&
          price<=7
        ){
          found.push(a);
        }
      }
    }

    found.sort((a,b)=>{
      const sd=(b.stability?.count||0)-(a.stability?.count||0);
      if(sd!==0) return sd;
      return Number(a.pivot?.price||0)-Number(b.pivot?.price||0);
    });

    if(!found.length){
      status.textContent="انتهى المسح — لم يظهر سهم ثبت عند القاع 3 أو 4 أيام ضمن $1–$7.";
      results.innerHTML='<div class="empty">لم يظهر سهم يحقق: هبوط + قاع + ثبات 3 أو 4 أيام.</div>';
      return;
    }

    status.innerHTML="تم المسح ✓ — وجدنا "+found.length+" سهم عنده قاع ثابت 3–4 أيام.";
    results.innerHTML=found.map(renderPivotAutoCard).join("");
  }catch(error){
    status.innerHTML='<div class="error">تعذر تشغيل مسح الارتكاز: '+escapeHtml(error.message)+'</div>';
  }
}

/* =========================
   تشغيل الفرز
========================= */

async function scanSplits(){

const symbols=
parseSymbols();

const status=
document.getElementById("scanStatus");

const results=
document.getElementById("scanResults");


if(!symbols.length){

status.innerHTML=
`<div class="error">
أدخل رموز الأسهم أولاً.
</div>`;

results.innerHTML="";

return;

}


results.innerHTML="";

let found=[];

let errors=[];


for(
let i=0;
i<symbols.length;
i++
){

const symbol=
symbols[i];

status.textContent=
`جاري فحص ${symbol} — ${i+1} من ${symbols.length}...`;


try{

const result=
await getStock(symbol);

const analysis=
analyze(result);


/*
نقبل فقط:
- يوجد تقسيم
- من اليوم 1 إلى 100
- يوجد بيانات بعد التقسيم
- يوجد قاع بعد التقسيم
*/

if(
analysis.split&&
analysis.daysAfter>=1&&
analysis.daysAfter<=100&&
analysis.lowestAfter
){

found.push(analysis);

}

}catch(error){

errors.push(
symbol+": "+error.message
);

}

}


/*
ترتيب من الأقرب للتقسيم
1 ثم 2 ثم 3 ... 100
*/

found.sort(
(a,b)=>
a.daysAfter-b.daysAfter
);


if(!found.length){

status.textContent=
"انتهى الفرز — لا توجد نتائج مطابقة.";

results.innerHTML=
`<div class="empty">
لم يظهر سهم مقسم من اليوم 1 إلى 100 مع قاع بعد التقسيم من الرموز المدخلة.
</div>`;

if(errors.length){

results.innerHTML+=
`<div class="error">
بعض الرموز لم يتم فحصها:<br>
${escapeHtml(errors.join("\n"))}
</div>`;

}

return;

}


status.innerHTML=
`تم الفرز ✓ — وجدنا ${found.length} سهم مطابق.`;


results.innerHTML=
found
.map(renderScanCard)
.join("");


if(errors.length){

results.innerHTML+=
`<div class="error">
تعذر فحص بعض الرموز:<br>
${escapeHtml(errors.join("\n"))}
</div>`;

}

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فاحص الارتكاز</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10262b;--muted:#77868a;--dark:#07353a;--green:#12a987;--green2:#dff5ee;--yellow:#fff0cc;--yellowInk:#8a5a00;--red:#b44d45;--line:#e0e7e6;--shadow:0 8px 24px rgba(24,48,52,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:820px;margin:auto;padding:14px 12px 42px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 10px}.brand{text-align:center;flex:1}.brand h1{font-size:25px;margin:0;font-weight:900}.brand p{margin:3px 0 0;color:#77868a;font-size:13px}.circle{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:21px}
.scanbar{background:var(--dark);color:#fff;border-radius:18px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;box-shadow:var(--shadow)}.live{color:#20d2a9}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16c99d;margin-left:5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#e5ecea;border-radius:18px;padding:4px;margin-top:12px}.tab{border:0;background:transparent;padding:13px 4px;border-radius:15px;color:#3f4e52;font-weight:800}.tab.active{background:#fff;box-shadow:0 3px 12px #163b4010}.tab small{display:block;color:var(--green);font-size:11px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{background:#fff;border-radius:17px;padding:13px 8px;text-align:center;box-shadow:var(--shadow)}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:#718084}
.searchrow{display:flex;gap:8px;margin-top:12px}.search{flex:1;position:relative}.search input{width:100%;height:52px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:0 45px 0 14px;outline:none}.search span{position:absolute;right:16px;top:13px;font-size:21px;color:#77868a}.filterbtn{border:0;background:var(--dark);color:#fff;border-radius:17px;padding:0 18px;font-weight:900}
.filterpanel{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:9px;box-shadow:var(--shadow)}.filterpanel.open{display:block}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 4px}.field select,.field input{width:100%;border:1px solid var(--line);background:#f7faf9;border-radius:12px;padding:10px;color:var(--ink)}
.resultshead{display:flex;justify-content:space-between;align-items:center;margin:17px 3px 9px}.resultshead b{font-size:18px}.sort{border:0;background:transparent;color:#637276}
.card{background:#fff;border-radius:22px;margin:9px 0;box-shadow:var(--shadow);overflow:hidden}.cardtop{padding:14px 15px 10px;display:grid;grid-template-columns:1fr auto;gap:10px}.tickerline{display:flex;align-items:center;gap:8px}.ticker{font-size:22px;font-weight:950;letter-spacing:.2px}.flag{font-size:18px}.company{font-size:12px;color:var(--muted);margin-top:3px}.hq{font-size:11px;color:#89979a;margin-top:3px}.price{text-align:left;direction:ltr}.price b{font-size:24px}.chg{font-size:12px;font-weight:800}.up{color:#0c8d70}.down{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--green2);color:#137963;border-radius:16px;padding:7px 10px;font-size:12px;font-weight:900;margin-top:7px}.badge.warn{background:var(--yellow);color:var(--yellowInk)}.score{font-size:15px;font-weight:950;color:#137963}
.metrics{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 13px}.metric{padding:5px 7px;border-left:1px solid var(--line)}.metric:nth-child(3n){border-left:0}.metric label{display:block;color:#879397;font-size:10px}.metric b{font-size:13px;margin-top:3px;display:block}
.more{border-top:1px solid var(--line);padding:9px 13px;display:flex;justify-content:space-between;align-items:center}.more button{border:0;background:var(--dark);color:#fff;border-radius:11px;padding:8px 13px;font-weight:800}.fresh{color:#89979a;font-size:10px}
.detail{display:none;background:#06343a;color:#fff;border-radius:22px;padding:17px;margin-top:13px;box-shadow:var(--shadow)}.detail.show{display:block}.detailtop{display:flex;justify-content:space-between;gap:10px}.detail h2{margin:0;font-size:25px}.detail .sub{color:#b8c9ca;font-size:12px;margin-top:3px}.detailprice{text-align:left;direction:ltr}.detailprice b{font-size:28px}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.ditem{background:#0b444a;border:1px solid #1b5b60;border-radius:14px;padding:10px}.ditem label{display:block;color:#a6c1c2;font-size:10px}.ditem b{display:block;margin-top:4px}.sectionTitle{font-size:15px;font-weight:900;margin:18px 0 8px}.steps{background:#0a3c42;border-radius:15px;overflow:hidden}.step{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #185158;font-size:12px}.step:last-child{border-bottom:0}.okc{color:#35d5ad}.warnc{color:#ffd276}.mutedc{color:#b5c1c2}
.note{color:#758487;font-size:11px;line-height:1.7;margin:13px 3px}.empty{padding:25px;text-align:center;color:#7a888b}.loading{opacity:.65}
@media(max-width:540px){.app{padding-left:9px;padding-right:9px}.brand h1{font-size:22px}.stats{gap:6px}.stat b{font-size:24px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3n){border-left:1px solid var(--line)}.metric:nth-child(2n){border-left:0}.fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="circle" id="settings">⚙️</button>
    <div class="brand"><h1>فاحص الارتكاز</h1><p>أسهم السوق الأمريكي بفلتر استراتيجية الارتكاز</p></div>
    <button class="circle" id="refresh">☷</button>
  </header>

  <div class="scanbar"><span><i class="dot"></i>آخر مسح <b id="lastScan">—</b></span><span>المسح القادم <b id="nextScan">يومياً</b></span></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tf="4h">4 ساعات</button>
    <button class="tab active" data-tf="1d">يومي<small>الأساس</small></button>
    <button class="tab" data-tf="1w">أسبوعي</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="ready">0</b><span>جاهز</span></div>
    <div class="stat"><b id="near">0</b><span>قريب من الجاهزية</span></div>
    <div class="stat"><b id="watch">0</b><span>مراقبة مبكرة</span></div>
  </div>

  <div class="searchrow">
    <div class="search"><span>⌕</span><input id="search" placeholder="ابحث برمز السهم أو اسمه"></div>
    <button class="filterbtn" id="filterBtn">الفلاتر ☰</button>
  </div>

  <div class="filterpanel" id="filterPanel">
    <div class="fields">
      <div class="field"><label>نطاق السعر</label><select id="priceRange"><option value="1-10">1 - 10 دولار</option><option value="1-7">1 - 7 دولار</option><option value="1-5">1 - 5 دولار</option></select></div>
      <div class="field"><label>الحد الأدنى للحجم</label><select id="minVol"><option value="1000000">1M</option><option value="100000">100K</option><option value="2000000">2M</option></select></div>
      <div class="field"><label>RSI</label><select id="rsiRange"><option value="all">الكل</option><option value="23-27">23 - 27</option><option value="20-40">20 - 40</option><option value="23-35">23 - 35</option></select></div>
      <div class="field"><label>RVOL الأدنى</label><select id="minRvol"><option value="1.2">1.2</option><option value="0.8">0.8</option><option value="1.5">1.5</option><option value="2">2.0</option></select></div>
      <div class="field"><label>ثبات</label><select id="stableDays"><option value="0">بدون شرط</option><option value="4">4 أيام</option><option value="3">3 أيام</option><option value="2">2 يوم</option></select></div>
      <div class="field"><label>البعد عن الدعم</label><select id="maxDistance"><option value="999">بدون شرط</option><option value="20">≤ 20%</option><option value="30">≤ 30%</option><option value="50">≤ 50%</option></select></div>
      <div class="field"><label>MACD</label><select id="macdFilter"><option value="any">الكل</option><option value="positive">يتحسن فقط</option></select></div>
      <div class="field"><label>المتوسطات 20/30/50</label><select id="emaFilter"><option value="any">الكل</option><option value="above">تعافي 20/30/50</option></select></div>
      <div class="field"><label>الأيام منذ التقسيم</label><select id="splitDays"><option value="all">الكل</option><option value="100">آخر 100 يوم</option><option value="50">آخر 50 يوم</option><option value="30">آخر 30 يوم</option></select></div>
    </div>
  </div>

  <div class="resultshead"><b>الأسهم المطابقة للفلاتر <span id="count">0</span></b><select class="sort" id="sort"><option value="score">الدرجة الأعلى</option><option value="rvol">RVOL</option></select></div>
  <div id="results"><div class="empty">اضغط «تحديث» لجلب البيانات</div></div>

  <div id="detail" class="detail"></div>
  <div class="note">البيانات الفنية وحساب الارتكاز تعتمد على البيانات التي يوفرها مزود السوق.</div>
</div>

<script>
const state={tf:"1d",data:[],selected:null};
const $=id=>document.getElementById(id);
function fmt(n,d=2){return Number.isFinite(Number(n))?Number(n).toFixed(d):"—"}
function vol(n){n=Number(n);if(!Number.isFinite(n))return"—";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.round(n).toLocaleString()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function status(score){return score>=90?["جاهز","badge"]:score>=70?["قريب من الجاهزية","badge warn"]:["مراقبة مبكرة","badge"]}
function card(x,i){
 const [st,bc]=status(x.score), ch=Number(x.change||0);
 return `<article class="card" data-symbol="${esc(x.symbol)}">
  <div class="cardtop">
   <div><div class="tickerline"><span class="ticker">${esc(x.symbol)}</span><span class="flag">${x.country==="CN"?"🇨🇳":"🇺🇸"}</span></div><div class="company">${esc(x.name||"اسم الشركة غير متوفر")}</div><div class="hq">📍 ${esc(x.hq||"المقر غير متوفر")}</div><span class="${bc}">${st}</span></div>
   <div class="price"><b>$${fmt(x.price,2)}</b><div class="chg ${ch>=0?"up":"down"}">${ch>=0?"+":""}${fmt(ch,2)}%</div></div>
  </div>
  <div class="metrics">
   <div class="metric"><label>الدرجة</label><b class="score">${fmt(x.score,0)}/100</b></div>
   <div class="metric"><label>الدعم</label><b>$${fmt(x.support,2)}</b></div>
   <div class="metric"><label>RSI14</label><b>${fmt(x.rsi,1)}</b></div>
   <div class="metric"><label>RVOL</label><b>${fmt(x.rvol,2)}</b></div>
   <div class="metric"><label>التقسيم</label><b>${x.splitDate?esc(x.splitDays+" يوم"):"—"}</b></div>
   <div class="metric"><label>الثبات</label><b>${x.stability||0}/${x.stabilityNeed||4}</b></div>
  </div>
  <div class="more"><span class="fresh">${esc(x.shortDate||x.updated||"")}</span><button onclick="showDetail('${esc(x.symbol)}')">عرض التفاصيل</button></div>
 </article>`
}
function render(){
 let q=$("search").value.trim().toUpperCase();
 let a=state.data.filter(x=>!q||x.symbol.includes(q)||(x.name||"").toUpperCase().includes(q));
 const [lo,hi]=$("priceRange").value.split("-").map(Number);
 const mv=Number($("minVol").value), mr=Number($("minRvol").value), sd=$("splitDays").value, rsiF=$("rsiRange").value;
 const stable=Number($("stableDays").value), maxDist=Number($("maxDistance").value), macdF=$("macdFilter").value, emaF=$("emaFilter").value;
 a=a.filter(x=>Number.isFinite(x.price)&&x.price>=lo&&x.price<=hi&&Number(x.volume||0)>=mv&&Number(x.rvol||0)>=mr&& (rsiF==="all" || (Number(x.rsi||0)>=Number(rsiF.split("-")[0])&&Number(x.rsi||0)<=Number(rsiF.split("-")[1])))&&Number(x.distance??999)<=maxDist&&(stable===0||Number(x.stability||0)>=stable)&&(macdF==="any"||x.macdOK===true)&&(emaF==="any"||x.emaOK===true));
 if(sd!=="all") a=a.filter(x=>x.splitDays!=null&&x.splitDays<=Number(sd));
 const s=$("sort").value;
 a.sort((x,y)=>s==="rvol"?y.rvol-x.rvol:y.score-x.score);
 $("count").textContent=a.length;
 $("ready").textContent=a.filter(x=>x.score>=90).length;
 $("near").textContent=a.filter(x=>x.score>=70&&x.score<90).length;
 $("watch").textContent=a.filter(x=>x.score<70).length;
 $("results").innerHTML=a.length?a.map(card).join(""):`<div class="card empty">لا توجد نتائج بهذه الفلاتر. افتح «الفلاتر» ووسّع الشروط لعرض الأسهم التي تم جلبها.</div>`;
}
async function load(){
 $("results").innerHTML=`<div class="card empty loading">جاري المسح وجلب البيانات…</div>`;
 try{
   const r=await fetch(`/.netlify/functions/stock?tf=${encodeURIComponent(state.tf)}`);
   if(!r.ok) throw new Error("تعذر الاتصال بوظيفة البيانات");
   const j=await r.json(); state.data=j.stocks||[];
   $("lastScan").textContent=(j.updated||new Date().toLocaleTimeString("ar-SA"))+(j.source?" · "+j.source:"");
   if(!state.data.length && j.errors?.length){ $("results").innerHTML=`<div class="card empty">⚠️ لم تصل بيانات قابلة للفحص.<br><small>${esc(j.errors.join(" | "))}</small></div>`; return; }
   render();
 }catch(e){
   $("results").innerHTML=`<div class="card empty">⚠️ ${esc(e.message)}<br><small>تأكد من إعداد مفاتيح API في Netlify ثم أعد المحاولة.</small></div>`;
 }
}
function showDetail(symbol){
 const x=state.data.find(v=>v.symbol===symbol); if(!x)return;
 state.selected=symbol;
 $("detail").innerHTML=`<div class="detailtop"><div><h2>${esc(x.symbol)}</h2><div class="sub">${esc(x.name||"")}</div><span class="badge">${status(x.score)[0]} · ${fmt(x.score,0)}/100</span></div><div class="detailprice"><b>$${fmt(x.price,2)}</b><div class="${Number(x.change)>=0?"up":"down"}">${Number(x.change)>=0?"+":""}${fmt(x.change,2)}%</div></div></div>
 <div class="detailgrid">
  <div class="ditem"><label>السعر بعد الإغلاق</label><b>$${fmt(x.afterHours,2)}</b></div><div class="ditem"><label>الدعم المعتمد</label><b>$${fmt(x.support,2)}</b></div>
  <div class="ditem"><label>المقاومة</label><b>$${fmt(x.resistance,2)}</b></div><div class="ditem"><label>المسافة عن الدعم</label><b>${fmt(x.distance,1)}%</b></div>
  <div class="ditem"><label>الفلوت</label><b>${vol(x.float)}</b></div><div class="ditem"><label>القيمة السوقية</label><b>${vol(x.marketCap)}</b></div>
  <div class="ditem"><label>Gap</label><b>${x.gap==null?"غير متاح":fmt(x.gap,2)+"%"}</b></div>
  <div class="ditem"><label>التقسيم</label><b>${x.splitDate?esc(x.splitDate):"لا يوجد"}</b></div><div class="ditem"><label>أيام منذ التقسيم</label><b>${x.splitDays==null?"—":x.splitDays}</b></div>
  <div class="ditem"><label>أعلى سعر بعد التقسيم</label><b>$${fmt(x.highAfterSplit,2)}</b></div><div class="ditem"><label>نوع التقسيم</label><b>${x.splitFrom&&x.splitTo?esc(x.splitFrom+":"+x.splitTo):"غير متاح"}</b></div>
 </div>
 <div class="sectionTitle">مراحل استراتيجية الارتكاز</div><div class="steps">
  ${[
   ["القاع والدعم",`$${fmt(x.support,2)}`,x.supportOK],
   ["قرب السعر من الدعم",fmt(x.distance,1)+"%",x.distance<=20],
   ["RSI (23-27)",fmt(x.rsi,1),x.rsi>=23&&x.rsi<=27],
   ["شمعة ارتداد",x.rebound?"موجودة":"غير مؤكدة",x.rebound],
   ["MACD يتحسن",x.macdTrend||"—",x.macdOK],
   ["تعافي المتوسطات 20/30/50",x.emaState||"—",x.emaOK],
   ["تحسن الحجم / RVOL",x.volumeImproving?fmt(x.rvol,2):fmt(x.rvol,2)+" — ضعيف",x.volumeImproving],
   ["الثبات",`${x.stability||0}/${x.stabilityNeed||4} أيام`,(x.stability||0)>=(x.stabilityNeed||4)],
   ["المساحة والهدف",x.room?"موجودة":"غير مؤكدة",x.room],
   ["التقسيم",x.splitDate?`${x.splitDays} يوم`:"—",x.splitDate?true:null]
  ].map(s=>`<div class="step"><span>${esc(s[0])}</span><b class="${s[2]===true?"okc":s[2]===false?"warnc":"mutedc"}">${esc(s[1])} ${s[2]===true?"✓":s[2]===false?"•":""}</b></div>`).join("")}
 </div>`;
 $("detail").classList.add("show");$("detail").scrollIntoView({behavior:"smooth",block:"start"});
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.tf=b.dataset.tf;load()});
$("filterBtn").onclick=()=>$("filterPanel").classList.toggle("open");
$("refresh").onclick=load;$("search").oninput=render;$("sort").onchange=render;
["priceRange","minVol","rsiRange","minRvol","stableDays","maxDistance","macdFilter","emaFilter","splitDays"].forEach(id=>$(id).onchange=render);
$("settings").onclick=()=>$("filterPanel").classList.add("open");
load();
</script>
</body>
</html>
